name: 问题反馈 / Bug Report
description: 报告崩溃、功能异常、结果不符或文案样式等各类问题 / Report a crash, misbehaving feature, wrong result, or a wording or styling problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## 问题反馈 / Bug report

        请在下方第一个字段里选择**严重等级 / Severity**，三个等级的判定标准如下。
        Pick the **severity** in the first field below. The three levels mean:

        - **高 High** —— 应用无法启动、启动即崩溃、界面卡死；倒数日或配置丢失、被重置；核心功能完全失效（桌面卡片不显示、托盘菜单或全局快捷键无效、设置无法保存）
          / The app won't start, crashes or freezes; countdown data or settings are lost or reset; a core feature is fully broken.
        - **中 Medium** —— 功能还能用但明显异常：天数、日期或文案计算不对；设置改了不生效或重启后回到原样；界面错位、控件重叠到影响使用
          / A feature still works but misbehaves: wrong day count, date or text; a setting does not apply or reverts; layout broken enough to block usage.
        - **低 Low** —— 错别字、翻译不准确、颜色字号圆角间距等视觉细节、提示文案看不懂、README 与界面说明不符
          / Typos, inaccurate translations, visual nits, confusing hints, or docs that no longer match the app.

        > **已有功能不够好用、希望新增或改进**，请改用「**功能建议 / Feature Request**」模板。
        > **If you want a new capability or an improvement** rather than a fix, please use the **Feature Request** template.
        >
        > 用中文或 English 填写都可以，我们会用你在下面选择的语言回复。
        > Write in Chinese or English; we reply in the language you pick below.
  - type: dropdown
    id: severity
    attributes:
      label: 严重等级 / Severity
      description: 选最接近的一项；不确定时选「中 Medium」，我们可能会调整 / Pick the closest one; if unsure, choose Medium — maintainers may re-label it
      options:
        - 高 High（无法启动、崩溃、数据丢失、核心功能失效 / unusable）
        - 中 Medium（功能可用但明显异常或结果不对 / works but misbehaves）
        - 低 Low（文案、翻译、样式与体验细节 / wording, styling, UX nits）
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: 回复语言 / Reply language
      description: 只决定维护者回复所用的语言；描述用哪种语言都行 / Only sets the language of our reply; describe the issue in either language
      options:
        - 简体中文
        - English
        - 中英双语 Both
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: 应用版本 / App version
      description: 全局设置 → 关于 中可以看到，或看安装包文件名 / Shown in Settings → About, or in the installer file name
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: 操作系统 / OS version
      description: 可选。Windows 版本与内部版本号，命令行运行 winver 可查；视觉类问题建议填写 / Optional — run winver to check; helpful for visual issues
      placeholder: "Windows 11 26H2 (build 26300.9457)"
    validations:
      required: false
  - type: dropdown
    id: run_mode
    attributes:
      label: 运行方式 / How it runs
      options:
        - 安装包安装（NSIS）/ Installed from the NSIS installer
        - 开发模式 pnpm dev / Dev mode (pnpm dev)
        - 自行构建 pnpm run dist / Self-built (pnpm run dist)
        - 其他 Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及的功能 / Affected area
      description: 选最接近的一项，也可以在描述里补充 / Pick the closest one and add details in the description
      options:
        - 启动与运行 / 启动、崩溃、卡死 / Startup and runtime
        - 倒数日列表 / 新增、编辑、复制、删除、启用停用 / Countdown list
        - 日期与文案 / 每年重复、一次性日期、状态文案 / Date and text
        - 外观与预设主题 / Appearance and presets
        - 布局与位置 / 四角停靠、偏移、卡片宽度 / Layout and position
        - 行为 / 显示模式、透明度、总在最前 / Behavior
        - 系统集成 / 托盘、全局快捷键、开机自启 / System integration
        - 配置文件 / 保存、迁移、恢复默认 / Config file
        - 其他 Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述 / What happened
      description: 一两句话讲清楚即可 / A one or two sentence summary is enough
      placeholder: 例：切换倒数日之后，桌面卡片一直是空白 / e.g. After switching the active countdown the desktop card stays blank
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 越具体越好，能稳定复现最佳；文案、样式类问题可改写成「在哪个页面看到」/ Be as specific as you can; for wording or styling nits, say where you saw it
      placeholder: |-
        1. 打开设置 → 倒数日列表
        2. 选中另一项
        3. 观察桌面卡片
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / Expected result
      placeholder: 例：卡片立即显示新选中的倒数日 / e.g. The card immediately shows the newly selected countdown
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual result
      description: 有弹窗或控制台报错请一并贴上 / Paste any dialog or console error text here
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: 出现频率 / How often
      options:
        - 每次必现 / Always
        - 经常出现 / Often
        - 偶尔出现 / Sometimes
        - 只出现一次 / Only once
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: 受影响的功能 / Affected areas
      description: 可选，可多选。选了「高 High」的话请尽量勾上 / Optional, select all that apply; please fill this in when the severity is High
      options:
        - label: 无法启动，或启动即崩溃 / Won't start or crashes on launch
        - label: 倒数日或配置数据丢失、被重置 / Countdown or settings data lost or reset
        - label: 桌面卡片不显示或显示异常 / Desktop card missing or rendered wrong
        - label: 托盘图标或右键菜单失效 / Tray icon or menu broken
        - label: 全局快捷键失效 / Global hotkey broken
        - label: 设置界面的修改无法保存 / Settings changes are not saved
        - label: 其他（见上方问题描述）/ Other (see the description above)
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏 / Screenshots or screen recording
      description: 可选。把图片或视频直接拖进这个输入框；界面类问题带上会快很多 / Optional. Drag images or video into this box; it speeds up UI issues a lot
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志与报错 / Logs and error output
      description: 可选。pnpm dev 的终端输出、DevTools 控制台报错都可以 / Optional — dev terminal output or DevTools console errors
      placeholder: 直接粘贴文本，或把 .txt / .log 文件拖进这个输入框 / Paste text, or drag a .txt / .log file into this box
    validations:
      required: false
  - type: textarea
    id: config_snippet
    attributes:
      label: 配置文件片段 / config.json snippet
      description: 可选。文件位于 %APPDATA%\countingdown\config.json，请先删除不想公开的日期与文案 / Optional. Located at %APPDATA%\countingdown\config.json; remove any dates or text you do not want to share
      placeholder: |-
        {
          "runtime": { "language": "zh-CN" }
        }
    validations:
      required: false
  - type: textarea
    id: supplement
    attributes:
      label: 补充信息 / Additional information
      description: 可选。这里可以写你想说的其他信息 / Optional. Anything else you want to add
      placeholder: 例：我想说... / e.g. I want to say...
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我已在最新版本（或最新 main 分支）上复现 / 
            I reproduced this on the latest release or on main
          required: true
        - label: -| 我已搜索过现有 issue，确认没有重复 /
            I searched existing issues and found no duplicate
          required: true
        - label: 我已移除日志、截图、配置中的隐私信息 / 
            I removed private information from logs, screenshots and config
          required: true
