name: 功能建议 / Feature Request
description: 期望新增或改进、但当前版本还没有的功能 / A capability or improvement you would like to see
title: "[功能建议 Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## 功能建议 / Feature request

        **这里适合提交 / Good fits for this template:**

        - 希望新增的能力，例如新的显示项、新的外观选项、新的交互方式
          New capabilities: extra display elements, appearance options, or interactions.
        - 现有功能希望做得更好，例如更细的设置、更顺手的操作路径
          Improvements to existing features, such as finer settings or fewer clicks.
        - 性能、体积、资源占用方面的期待
          Performance, package size or resource usage expectations.

        **已有功能坏了、没生效、不符合预期，请不要用本模板**，请改用「问题反馈 / Bug Report」，并在其中选择严重等级。
        **If an existing feature is broken, missing in action, or behaves wrongly, do not use this template** —
        please use **Bug Report** and pick the severity level there.

        > 用中文或 English 填写都可以，我们会用你在下面选择的语言回复。
        > Write in Chinese or English; we reply in the language you pick below.
  - type: dropdown
    id: language
    attributes:
      label: 回复语言 / Reply language
      description: 只决定维护者回复所用的语言；描述用哪种语言都行<br>
        Only sets the language of our reply; describe the idea in either language
      options:
        - 简体中文
        - English
        - 中英双语 Both
    validations:
      required: true
  - type: dropdown
    id: request_kind
    attributes:
      label: 建议类型 / Kind of request
      options:
        - 新增功能 / New capability
        - 现有功能改进 / Improve an existing feature
        - 交互与体验优化 / UX and interaction polish
        - 外观与主题 / Appearance and themes
        - 性能与体积 / Performance and package size
        - 文档与说明 / Documentation
        - 其他 Other
    validations:
      required: true
  - type: textarea
    id: feature
    attributes:
      label: 想要的功能 / What you would like
      description: 一两句话讲清楚即可<br>
        A one or two sentence summary is enough
      placeholder: 例：希望每一项倒数日都能单独设置显示模式（只显示天数 / 天时分秒）/ e.g. Let each countdown item override the display mode
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: 使用场景与痛点 / Use case and why it matters
      description: 你现在是怎么做的？缺了它有什么不方便？<br>
        How do you handle this today, and what is awkward about it?
      placeholder: |-
        例：我有两个倒数日，一个只想看天数，另一个想看到秒。
        现在只能全局限定一种模式，只能来回改全局设置。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的实现方式 / Proposed solution
      description: 可选。有具体想法（放在哪个页面、叫什么名字、怎么交互）请写在这里<br>
        Optional — where it would live, what it would be called, how it would behave
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives you have considered
      description: 可选。其他工具怎么做的、有没有能凑合的办法<br>
        Optional — how other tools solve it, or any workaround that almost works
    validations:
      required: false
  - type: dropdown
    id: importance
    attributes:
      label: 对你的重要程度 / How much it matters to you
      description: 帮助我们排优先级，不会影响是否被采纳<br>
        Helps us prioritise; it does not decide whether the idea is accepted
      options:
        - 影响日常使用，很需要 / Blocks my daily use
        - 明显提升体验 / Noticeably better experience
        - 锦上添花 / Nice to have
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: 应用版本 / App version
      description: 可选。全局设置 → 关于 中可以看到<br>
        Optional. Shown in Settings → About
      placeholder: "1.0.0"
    validations:
      required: false
  - type: textarea
    id: mockups
    attributes:
      label: 示意图或参考 / Mockups or references
      description: 可选。手绘草图、其他软件的截图、链接都可以，直接拖进输入框<br>
        Optional. Sketches, screenshots of other apps, or links — drag files into this box
    validations:
      required: false
  - type: textarea
    id: supplement
    attributes:
      label: 补充信息 / Additional information
      description: 可选。这里可以写你想说的其他信息<br>
        Optional. Anything else you want to add
      placeholder: 例：我想说... / e.g. I want to say...
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我已在 README 的「功能一览」与现有 issue 中搜索过，确认这个功能还没有<br>
            I checked the README feature list and existing issues and this does not exist yet
          required: true
        - label: 我确认这不是「已有功能失效或不符合预期」（那属于问题反馈）<br>
            I confirm this is not an existing feature that is broken or misbehaving (that belongs in Bug Report)
          required: true
        - label: 我愿意自己提 PR 实现这个功能<br>
            I am willing to open a pull request for this
          required: false
