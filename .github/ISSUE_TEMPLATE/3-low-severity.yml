name: 问题反馈（低） / Bug Report (Low)
description: 文案、翻译、样式与体验细节等轻微问题 / Minor wording, translation, styling or UX details
title: "[低 Low] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## 低严重度 / Low severity

        **适合提交到这里的内容 / Good fits for this template:**

        - 错别字、翻译不准确、中英混排不一致 / Typos, inaccurate translations, inconsistent zh/en wording.
        - 颜色、字号、圆角、间距等视觉细节不舒服 / Slightly off colors, font sizes, radii or spacing.
        - 提示文案看不懂，或缺少必要的说明 / Confusing hints, or missing explanations.
        - README、界面说明与实际情况不符 / README or in-app text that no longer matches the app.
        - 功能建议与改进想法 / Feature suggestions and ideas.

        影响正常使用的问题请改用 **中** 或 **高** 模板。
        If the problem blocks normal use, please use the **Medium** or **High** template.

        > 用中文或 English 填写都可以，维护者会用你在下面选择的语言回复。
        > Write in Chinese or English; we reply in the language you pick below.
  - type: dropdown
    id: language
    attributes:
      label: 回复语言 / Reply language
      description: 只决定维护者回复所用的语言；描述用哪种语言都行 / Only sets the language of our reply; describe the issue in either language
      options:
        - 简体中文
        - English
        - 中英双语 Both
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 问题类型 / Issue kind
      options:
        - 文案与翻译 / Wording and translation
        - 视觉样式（颜色、字号、圆角、间距）/ Visual styling
        - 交互与体验 / Interaction and UX
        - 文档与说明 / Documentation
        - 功能建议 / Feature suggestion
        - 其他 Other
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: 应用版本 / App version
      description: 全局设置 → 关于 中可以看到，或看安装包文件名 / Shown in Settings → About, or in the installer file name
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: 操作系统 / OS version
      description: 可选，视觉类问题填上更好排查 / Optional; helps for visual issues
      placeholder: "Windows 11 23H2 (build 22631)"
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: 问题描述 / What is wrong
      description: 一两句话讲清楚即可 / A one or two sentence summary is enough
      placeholder: 例：「已远去」的英文文案看起来不太自然 / e.g. The English wording for 已远去 reads oddly
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望效果 / What you would expect
      description: 如果是建议，直接写你希望它变成什么样 / For suggestions, describe the behaviour you would like
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现或看到它的位置 / Where to find it
      description: 可选。例如「全局设置 → 外观 → 字体族」 / Optional, e.g. Settings → Appearance → Font family
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / Screenshots
      description: 可选。把图片直接拖进这个输入框 / Optional. Drag images into this box
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我已搜索过现有 issue，确认没有重复 / I searched existing issues and found no duplicate
          required: true
        - label: 我已在最新版本（或最新 main 分支）上确认过 / I checked this against the latest release or main
          required: false
        - label: 我愿意自己提 PR 修复这个问题 / I am willing to open a pull request for this
          required: false
